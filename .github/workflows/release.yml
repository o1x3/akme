name: release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  release-version:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Validate version
        id: version
        run: |
          scripts/validate-version.sh
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump VERSION before releasing."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes npm package @o1x3/akme at the same VERSION via Trusted
      # Publishing (OIDC). Do NOT set NODE_AUTH_TOKEN — an empty/_authToken
      # line from setup-node short-circuits OIDC. Configure the trusted
      # publisher on https://www.npmjs.com/package/@o1x3/akme → Settings
      # (GitHub: o1x3/akme, workflow: release.yml).
      - name: Publish @o1x3/akme to npm
        working-directory: npm
        run: |
          version="${{ steps.version.outputs.version }}"
          npm version "$version" --no-git-tag-version --allow-same-version

          # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          # Unset/empty auth blocks OIDC; strip it so Trusted Publishing works.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            tmp="$(mktemp)"
            grep -v '_authToken' "$npmrc" >"$tmp" || true
            mv "$tmp" "$npmrc"
          fi
          unset NODE_AUTH_TOKEN

          npm publish --access public
