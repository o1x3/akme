name: release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  release-version:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Validate version
        id: version
        run: |
          scripts/validate-version.sh
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump VERSION before releasing."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes platform packages (@o1x3/akme-<os>-<arch>) then the meta
      # package @o1x3/akme via Trusted Publishing (OIDC). Binaries ship inside
      # the platform packages (esbuild/Sentry pattern) so npx installs from the
      # npm CDN instead of downloading GitHub release assets at runtime.
      # Configure trusted publishers (same workflow) on each package:
      #   @o1x3/akme, @o1x3/akme-darwin-arm64, @o1x3/akme-darwin-x64,
      #   @o1x3/akme-linux-arm64, @o1x3/akme-linux-x64
      # Do NOT set NODE_AUTH_TOKEN — an empty/_authToken line from setup-node
      # short-circuits OIDC (publish-release.js strips it).
      - name: Publish @o1x3/akme (+ platform packages) to npm
        run: |
          node npm/scripts/publish-release.js \
            --version "${{ steps.version.outputs.version }}" \
            --dist dist
