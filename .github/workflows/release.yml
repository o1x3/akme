name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Check
        run: scripts/check.sh

  # After tests on main: release only when VERSION changed (or manual dispatch).
  release:
    needs: test
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Confirm VERSION changed
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qx VERSION; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "VERSION unchanged — skipping release"
          fi

      - if: steps.gate.outputs.release == 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - if: steps.gate.outputs.release == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - if: steps.gate.outputs.release == 'true'
        name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - if: steps.gate.outputs.release == 'true'
        name: Validate version
        id: version
        run: |
          scripts/validate-version.sh
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.release == 'true'
        name: Create release tag
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump VERSION before releasing."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - if: steps.gate.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes akme-cli via Trusted Publishing (OIDC). Native binaries ship
      # on the GitHub release; postinstall / bare `npx akme-cli` download them.
      # Trusted publisher MUST use workflow filename release.yml (this file).
      # Do NOT set NODE_AUTH_TOKEN — an empty/_authToken line from setup-node
      # short-circuits OIDC (publish-release.js strips it).
      - if: steps.gate.outputs.release == 'true'
        name: Publish akme-cli to npm
        run: |
          node npm/scripts/publish-release.js \
            --version "${{ steps.version.outputs.version }}"
